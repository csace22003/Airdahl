[env:nucleo_f446re]
; platform = ststm32
; board = nucleo_f446re
; framework = arduino
; debug_tool = stlink
; upload_protocol = stlink

; platform = ststm32
; board = nucleo_f446re
; framework = arduino

; debug_tool = stlink

; upload_protocol = custom
; upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/scripts -f board/st_nucleo_f4.cfg -c "reset_config none" -c "program {$SOURCE} 0x08000000 verify; shutdown"

platform = ststm32
board = nucleo_f446re
framework = arduino

upload_protocol = custom
upload_port = /dev/ttyUSB0  ; or COM

upload_command = ${platformio.packages_dir}/tool-stm32flash/stm32flash -b 115200 -m 8e1 -w $SOURCE -g 0x08000000 -v $UPLOAD_PORT

monitor_speed = 9600